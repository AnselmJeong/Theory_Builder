[workspace]
members = ["crates/core", "crates/engine", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "1"
tempfile = "3"

[profile.dev]
debug = 0
[profile.release]
strip = true
opt-level = 2
